*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;color:#222;}

/* ===== CABECERA Y PORTADA (igual que la pizarra de matemáticas) ===== */
header.hub-header{background:linear-gradient(120deg,#E6F0FF 0%,#CFE2FF 55%,#B9D4FF 100%);border-bottom:4px solid #1F4E9C;padding:12px 20px;position:sticky;top:0;z-index:1000;}
.hub-header-inner{max-width:1500px;margin:0 auto;}
.hub-header-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:nowrap;}
.hub-header-left{display:flex;align-items:center;gap:12px;flex:1 1 auto;min-width:0;}
.hub-right{display:flex;align-items:center;gap:12px;flex:0 0 auto;}
.hub-h1{color:#12337A;font-family:'Fredoka One',cursive;font-weight:400;font-size:clamp(22px,3vw,38px);line-height:1.1;margin:0;}
.hub-subtitulo{color:#2B4A85;font-weight:700;text-align:center;margin:6px 0 0;font-size:1.05em;}
.hub-logo{background:#fff;border-radius:10px;padding:2px 8px;box-shadow:0 2px 0 rgba(18,51,122,.25);border:2px solid #cfe0ff;}
.hub-logo img{display:block;height:clamp(40px,5vw,62px);width:auto;}
.hub-btn{background:#667eea;color:#fff;border:none;border-radius:10px;padding:9px 18px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;}
.hub-btn.verde{background:#28a745;}
.hub-tabs{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.hub-tabs button{padding:8px 16px;background:#f0f0f0;color:#333;border:none;border-radius:10px 10px 0 0;cursor:pointer;font-weight:700;font-size:13.5px;font-family:inherit;}
.hub-tabs button:hover{background:#e2e2e2;transform:none;}
.hub-tabs button.activa{background:var(--color-activa,#667eea);color:#fff;}
.hub-tabs button.bloqueada{background:#e4e4e4;color:#999;cursor:not-allowed;}
@media(max-width:700px){.hub-header-top{flex-wrap:wrap;}}
main.hub-inicio{max-width:1200px;margin:0 auto;padding:44px 20px;}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;}
.hub-tarjeta{background:#fff;border-radius:20px;padding:28px 24px;text-align:left;cursor:pointer;transition:all .25s;box-shadow:0 10px 30px rgba(0,0,0,.15);position:relative;overflow:hidden;font-family:inherit;border-width:4px;border-style:solid;color:#222;}
.hub-tarjeta:hover{transform:translateY(-4px);box-shadow:0 15px 40px rgba(0,0,0,.25);background:#fff;}
.hub-tarjeta.bloqueada{cursor:not-allowed;opacity:.7;}
.hub-tarjeta.bloqueada:hover{transform:none;}
.hub-tarjeta-icono{font-size:2.6em;margin-bottom:8px;}
.hub-tarjeta h2{font-family:'Fredoka One',cursive;font-weight:400;font-size:1.35em;margin:0 0 8px;}
.hub-tarjeta p{color:#666;font-size:.98em;margin:0;}
.hub-etiqueta-proximamente{position:absolute;top:12px;right:12px;background:#ffc107;color:#333;padding:4px 12px;border-radius:20px;font-size:.78em;font-weight:700;}
.hub-seccion{display:none;max-width:1500px;margin:0 auto;padding:20px;}
.hub-seccion.activa{display:block;}

/* ===== ESTILOS BASE (como en matemáticas) ===== */
.contenedor{max-width:1400px;margin:0 auto;background:#fff;border-radius:20px;padding:25px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.lg-cab{text-align:center;margin-bottom:16px;padding-bottom:12px;border-bottom:4px solid #667eea;}
.lg-cab h1{color:#667eea;font-size:2.2em;font-family:'Fredoka One',cursive;font-weight:400;}
.lg-cab p{color:#666;margin-top:4px;}
.tabs{display:flex;gap:5px;margin-bottom:15px;flex-wrap:wrap;}
.tab{padding:9px 13px;background:#e0e0e0;color:#222;border:none;border-radius:8px 8px 0 0;cursor:pointer;font-weight:700;font-size:13px;font-family:inherit;transition:all .3s;}
.tab:hover{background:#d0d0d0;color:#222;transform:none;}
.tab.active{background:#667eea;color:#fff;}
button{background:#667eea;color:#fff;border:none;padding:9px 18px;border-radius:8px;font-size:14px;cursor:pointer;font-weight:700;font-family:inherit;transition:all .2s;}
button:hover{background:#5568d3;}
button:disabled{opacity:.5;cursor:not-allowed;}
.bok{background:#28a745;} .bok:hover{background:#218838;}
.bpurp{background:#9c27b0;} .bpurp:hover{background:#7b1fa2;}
.lg-azul{background:#1976d2;} .lg-azul:hover{background:#125ea8;}
.badge-sc{background:linear-gradient(135deg,#28a745,#20c997);color:#fff;padding:6px 14px;border-radius:16px;font-weight:800;display:inline-block;font-size:.85em;}
.lg-badge{background:rgba(0,0,0,.12);border-radius:10px;padding:1px 7px;font-size:.85em;margin-left:3px;}
.tab.active .lg-badge{background:rgba(255,255,255,.3);}
.ibox{background:#e3f2fd;padding:10px 14px;border-radius:8px;margin:8px 0;border-left:4px solid #1976d2;font-size:.95em;line-height:1.5;}
.op-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;}
.op-tab{padding:8px 13px;background:#eee;color:#333;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px;}
.op-tab:hover{background:#ddd;color:#333;}
.op-tab.active{background:#764ba2;color:#fff;}

/* ===== BARRA DE LA ALUMNA ===== */
.lg-barra{background:#263238;border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.lg-barra .lg-t{color:#fff;font-weight:700;font-size:.9em;}
.lg-barra input,.lg-barra select{padding:7px 9px;border:2px solid #667eea;border-radius:7px;font-family:inherit;font-size:1em;max-width:200px;}
.lg-estado{color:#ffd54f;font-weight:700;font-size:.85em;}

/* ===== FICHAS DE CONCEPTO ===== */
.lg-fichas{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:10px;}
.lg-ficha{background:#fff;border:3px solid #cdd8ef;border-radius:12px;padding:10px 14px;line-height:1.45;}
.lg-ficha h4{color:#12337A;margin-bottom:4px;}
.lg-ficha p{margin:4px 0;}
.lg-ficha .lg-ej{color:#555;font-size:.92em;}
.lg-ficha-uso{border-color:#ffd180;background:#fffaf0;}

/* ===== PRÁCTICA ===== */
.lg-ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.lg-nivel{background:#eee;color:#333;}
.lg-nivel:hover{background:#ddd;color:#333;}
.lg-nivel.on{background:#F59E0B;color:#fff;}
.lg-zona{background:#f8f9fa;border:2px solid #ddd;border-radius:14px;padding:16px;min-height:200px;}
.lg-titulo{color:#12337A;font-family:'Fredoka One',cursive;font-weight:400;font-size:1.3em;margin-bottom:6px;}
.lg-enun{background:#e8f0ff;border-left:5px solid #1976d2;padding:8px 12px;border-radius:6px;font-weight:700;color:#0d47a1;margin-bottom:14px;}
.lg-frase{font-size:clamp(1.15em,2.4vw,1.5em);line-height:2.3;color:#1a1a1a;margin:6px 0 12px;}
.lg-texto{font-size:clamp(1.05em,2vw,1.25em);line-height:2.2;background:#fff;border:2px solid #e0e6f3;border-radius:12px;padding:10px 14px;}
.lg-pal{white-space:nowrap;}
.lg-gap{display:inline-block;min-width:1.4em;height:1.45em;line-height:1.3em;padding:0 3px;margin:0 1px;vertical-align:baseline;background:#fff;color:#12337A;border:2px dashed #667eea;border-radius:6px;font-size:1em;font-weight:800;text-align:center;cursor:pointer;}
.lg-gap:hover{background:#eef2ff;color:#12337A;}
.lg-gap.sel{border-style:solid;border-color:#F59E0B;box-shadow:0 0 0 3px rgba(245,158,11,.35);}
.lg-gap.lleno{border-style:solid;background:#eef2ff;}
.lg-gap.sinh{color:#9aa4c4;}
.lg-gap.mal{border-color:#c62828;background:#ffebee;}
.lg-gap.bien{border:2px solid #2e7d32;background:#e8f5e9;color:#1b5e20;cursor:default;opacity:1;}
.lg-gap.sol{border:2px solid #ef6c00;background:#fff3e0;color:#e65100;cursor:default;opacity:1;}
.lg-gap.oculto{min-width:0;width:6px;padding:0;color:transparent;}
.lg-gap.lg-sobre{background:#fff59d;}
.lg-gapw{min-width:4.2em;font-weight:700;}
.lg-gapmini{display:inline-block;width:.9em;height:1em;border:2px dashed #667eea;border-radius:4px;vertical-align:-2px;margin:0 1px;background:#fff;}
.lg-fichas-letras,.lg-opciones{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0 12px;min-height:10px;}
.lg-ficha-l{font-size:1.6em;min-width:2.4em;padding:8px 16px;background:#fff;color:#12337A;border:3px solid #9db3de;border-radius:12px;box-shadow:0 3px 0 #9db3de;}
.lg-ficha-l:hover{background:#eef2ff;color:#12337A;}
.lg-fichas-letras.apagado{opacity:.4;pointer-events:none;}
.lg-opc{font-size:1.15em;background:#fff;color:#12337A;border:3px solid #9db3de;border-radius:12px;padding:8px 16px;}
.lg-opc:hover{background:#eef2ff;color:#12337A;border-color:#667eea;}
.lg-acciones{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}

/* clasificar */
.lg-bandeja{display:flex;flex-wrap:wrap;gap:10px;min-height:64px;padding:10px;border:3px dashed #b0bec5;border-radius:12px;background:#fff;margin-bottom:12px;}
.lg-bandeja.vacia::after{content:'¡Todas colocadas! Pulsa «Comprobar».';color:#78909c;font-weight:700;align-self:center;}
.lg-bandeja.lg-sobre{background:#fffde7;}
.lg-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:10px;}
.lg-col{background:#fff;border:3px solid #cdd8ef;border-radius:12px;min-height:150px;padding:8px;display:flex;flex-direction:column;gap:8px;align-items:stretch;}
.lg-col.lg-sobre{background:#fffde7;border-color:#F59E0B;}
.lg-colcab{background:#12337A;color:#fff;font-size:1.3em;border-radius:8px;}
.lg-colcab:hover{background:#1F4E9C;}
.lg-carta{background:#fff;color:#1a1a1a;border:3px solid #9db3de;border-radius:10px;font-size:1.25em;padding:8px 14px;box-shadow:0 3px 0 #9db3de;user-select:none;-webkit-user-select:none;font-weight:700;}
.lg-carta:hover{background:#f3f6ff;color:#1a1a1a;}
.lg-carta small{font-size:.65em;color:#607d8b;font-weight:600;}
.lg-carta.sel{border-color:#F59E0B;box-shadow:0 0 0 3px rgba(245,158,11,.4);}
.lg-carta.mal{border-color:#c62828;background:#ffebee;}
.lg-carta.bien{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;opacity:1;cursor:default;box-shadow:none;}
.lg-carta.sol{border-color:#ef6c00;background:#fff3e0;color:#e65100;opacity:1;cursor:default;box-shadow:none;}
.lg-origen{opacity:.35;}
.lg-fantasma{position:fixed;z-index:3000;pointer-events:none;opacity:.92;transform:rotate(-3deg);box-shadow:0 10px 25px rgba(0,0,0,.3)!important;}

/* palabras tocables */
.lg-tocable{line-height:2.4;}
.lg-chip{background:transparent;color:#1a1a1a;font-size:1em;font-weight:600;padding:0 3px;border-radius:6px;border:2px solid transparent;}
.lg-chip:hover{background:#eef2ff;color:#1a1a1a;}
.lg-chip:disabled{opacity:1;cursor:default;}
.lg-chip.noes{background:#eceff1;color:#78909c;}
.lg-chip.encontrado{background:#fff59d;border-color:#f9a825;}
.lg-chip.tachada .lg-w{text-decoration:line-through;text-decoration-color:#c62828;text-decoration-thickness:3px;color:#c62828;}
.lg-chip.tachada{background:#ffebee;}
.lg-chip.mayus{background:#e8eaf6;border-color:#7986cb;color:#1a237e;}
.lg-chip.mal{border-color:#ef6c00;border-style:dashed;}
.lg-chip.falta{border-color:#c62828;border-style:dashed;}
.lg-chip.bien{background:#e8f5e9;border-color:#2e7d32;color:#1b5e20;}
.lg-chip.sol{background:#fff3e0;border-color:#ef6c00;color:#e65100;}
.lg-chip s{color:#c62828;font-weight:400;}
.lg-escribe{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0;}
.lg-escribe label{font-weight:800;color:#12337A;}
.lg-in{width:min(260px,70vw);padding:8px 10px;border:3px solid #667eea;border-radius:10px;font-size:1.25em;font-family:inherit;}

/* panel de corrección */
.lg-fb{display:none;margin-top:12px;border-radius:12px;padding:10px 14px;line-height:1.5;}
.lg-fb.on{display:block;}
.lg-fb.warn{background:#fff3e0;border:2px solid #ff9800;color:#4e342e;}
.lg-fb.ok{background:#e8f5e9;border:2px solid #43a047;color:#1b5e20;}
.lg-fbcab{font-weight:800;margin-bottom:4px;}
.lg-fbitem{padding:6px 0;border-top:1px dashed rgba(0,0,0,.12);}
.lg-fbitem:first-of-type{border-top:none;}
.lg-mal{background:#ffcdd2;color:#b71c1c;font-weight:900;border-radius:3px;padding:0 2px;}
.lg-diff{font-size:1.15em;font-weight:700;background:#fff;padding:1px 6px;border-radius:6px;}
.lg-fin{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:14px;background:#ede7f6;border-radius:12px;padding:10px 14px;font-weight:700;color:#311b92;}

/* progreso */
.lg-prog{padding:4px;}
.lg-aviso{background:#fff8e1;border-left:4px solid #ffc107;padding:8px 12px;border-radius:6px;margin-bottom:10px;}
.lg-quien{color:#455a64;margin-bottom:10px;}
.lg-pbloque{background:#f8f9fa;border:2px solid #ddd;border-radius:12px;padding:12px 14px;margin-bottom:12px;}
.lg-pbloque h3{color:#12337A;margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.lg-pfila{display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(100px,2fr) minmax(170px,1.4fr);gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid #eceff1;}
.lg-pnom{font-weight:700;}
.lg-pbar{height:14px;background:#e0e0e0;border-radius:7px;overflow:hidden;}
.lg-pbar span{display:block;height:100%;border-radius:7px;}
.lg-pdat{font-size:.9em;color:#455a64;}
.lg-pnota{margin-top:8px;}
@media(max-width:640px){.lg-pfila{grid-template-columns:1fr 1fr;}.lg-pdat{grid-column:1/-1;}}
.lg-modal{display:none;position:fixed;inset:0;background:rgba(20,20,50,.55);z-index:5000;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;}
.lg-modal-caja{background:#fff;border-radius:16px;max-width:900px;width:100%;padding:20px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.lg-modal-caja h2{color:#12337A;font-family:'Fredoka One',cursive;font-weight:400;margin-bottom:10px;}
.lg-cerrar{position:absolute;top:10px;right:10px;background:#eceff1;color:#333;padding:6px 12px;}
.lg-cerrar:hover{background:#cfd8dc;color:#333;}

@media(max-width:600px){
  .contenedor{padding:14px;border-radius:14px;}
  .hub-seccion{padding:10px;}
  .lg-cab h1{font-size:1.7em;}
  .lg-zona{padding:10px;}
}
.lg-ficha-exc{border-color:#ffab91;background:#fff8f5;}
/* móvil y tablet vertical */
@media(max-width:700px){
  header.hub-header{position:static;padding:10px 12px;}
  .hub-tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
  .hub-tabs button{white-space:nowrap;flex:0 0 auto;}
  .lg-cols{grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;}
  .lg-col{min-height:120px;padding:6px;}
  .lg-carta{font-size:1.05em;padding:6px 9px;}
  .lg-col .lg-carta{overflow-wrap:anywhere;}
  .tabs .tab{font-size:12px;padding:8px 10px;}
}

.lg-gap:disabled{opacity:1;}
.lg-gap.bien,.lg-gap.sol{min-width:0;height:auto;padding:0 1px;margin:0;border-width:0 0 3px 0;border-radius:0;background:transparent;}
.lg-gap.bien{border-color:#2e7d32;color:#1b5e20;}
.lg-gap.sol{border-color:#ef6c00;color:#e65100;}
.lg-gap.lg-gapw.bien,.lg-gap.lg-gapw.sol{padding:0 3px;}
.lg-letra{color:#1b5e20;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px;}
.lg-carta.sol .lg-letra{color:#e65100;}
.lg-bandeja.terminado{display:none;}
.lg-gap,.lg-chip,.lg-carta,.op-tab,.lg-nivel,.tab{transition:none;}
.lg-gapmini{width:.8em;margin:0 2px;}

</style>

  ];
  function $(id) { return document.getElementById(id); }
  var grid = $('hub-grid'), tabs = $('hub-tabs');
  SECCIONES.forEach(function (s) {
    var bloq = s.tipo === 'proximamente';
    var b = document.createElement('button'); b.type = 'button';
    b.className = 'hub-tarjeta' + (bloq ? ' bloqueada' : '');
    b.style.borderColor = bloq ? '#ddd' : s.color;
    b.innerHTML = '<div class="hub-tarjeta-icono">' + s.icono + '</div><h2 style="color:' + (bloq ? '#999' : s.color) + '">' + s.nombre + '</h2><p>' + s.descripcion + '</p>' + (bloq ? '<div class="hub-etiqueta-proximamente">Próximamente</div>' : '');
    if (bloq) b.disabled = true; else b.addEventListener('click', function () { irASeccion(s.id); });
    grid.appendChild(b);
    var t = document.createElement('button'); t.type = 'button'; t.dataset.id = s.id;
    t.className = bloq ? 'bloqueada' : ''; t.textContent = s.icono + ' ' + s.nombre + (bloq ? ' 🔒' : '');
    if (bloq) t.disabled = true; else t.addEventListener('click', function () { irASeccion(s.id); });
    tabs.appendChild(t);
  });
  function irASeccion(id) {
    var s = SECCIONES.filter(function (x) { return x.id === id; })[0];
    if (!s || s.tipo === 'proximamente') return;
    $('pantalla-inicio').style.display = 'none';
    $('btn-inicio').style.display = 'inline-block';
    $('subtitulo-inicio').style.display = 'none';
    tabs.style.display = 'flex';
    $('titulo-cabecera').style.fontSize = 'clamp(20px,2.4vw,30px)';
    document.documentElement.style.setProperty('--color-activa', s.color);
    Array.prototype.forEach.call(tabs.children, function (b) { b.classList.toggle('activa', b.dataset.id === id); });
    Array.prototype.forEach.call(document.querySelectorAll('.hub-seccion'), function (z) { z.classList.remove('activa'); });
    $('seccion-' + id).classList.add('activa');
    $('btn-pantalla-completa').style.display = 'inline-block';
    window.scrollTo(0, 0);

  function irAInicio() {
    $('pantalla-inicio').style.display = 'block';
    $('btn-inicio').style.display = 'none';

  });
  window.irASeccion = irASeccion;
})();

<script>
/* ===================================================================
   NÚCLEO COMÚN DE LA PIZARRA DE LENGUA  (window.LG)
   Alumna, puntos, progreso (localStorage), envío a Apps Script,
   bolsas aleatorias sin repetición, arrastrar con ratón y dedo.
   =================================================================== */
window.LG = (function () {
  'use strict';
  // ⚙️ URL del Apps Script de la profesora (la hoja recibe {nombre, puntos:{...}})
  var URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbzFkaK7xiOf3TaYKFUsyf4m-scZWPK2E752Tu2zJ366fMZj5bS-5UYWIX1MdawoIUxaYw/exec';

  var KEY_PERFILES = 'lenguaPerfiles_v1';
  var KEY_BOLSAS = 'lenguaBolsas_v1';

  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { } }
  function ssGet(k) { try { return window.sessionStorage.getItem(k); } catch (e) { return null; } }
  function ssSet(k, v) { try { window.sessionStorage.setItem(k, v); } catch (e) { } }
  function leerJSON(k) { try { return JSON.parse(lsGet(k) || '{}') || {}; } catch (e) { return {}; } }

  var perfiles = leerJSON(KEY_PERFILES);
  var bolsas = leerJSON(KEY_BOLSAS);
  var anon = { nombre: '', grupo: '', ap: {} };   // puntos de esta sesión si no hay nombre
  var alumna = {
    nombre: ssGet('pizarraNombreAlumna') || lsGet('lenguaNombre') || '',
    grupo: ssGet('pizarraGrupoAlumna') || lsGet('lenguaGrupo') || ''
  };
  var bloques = [];        // bloques registrados (para progreso y envío)
  var oyentes = [];

  function clave(n) {
    return (n || '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ');
  }
  function perfil() {
    if (!alumna.nombre.trim()) return anon;
    var k = clave(alumna.nombre);
    if (!perfiles[k]) perfiles[k] = { nombre: alumna.nombre.trim(), grupo: alumna.grupo, ap: {} };
    perfiles[k].nombre = alumna.nombre.trim();
    if (alumna.grupo) perfiles[k].grupo = alumna.grupo;
    return perfiles[k];
  }
  function guardar() { if (alumna.nombre.trim()) lsSet(KEY_PERFILES, JSON.stringify(perfiles)); }
  function stats(apId) {
    var p = perfil();
    if (!p.ap[apId]) p.ap[apId] = { pts: 0, ok1: 0, tot: 0, nv: {} };
    return p.ap[apId];
  }
  function emitir() { oyentes.forEach(function (f) { try { f(); } catch (e) { } }); }
  function alCambiar(f) { oyentes.push(f); }

  /* res = 2 (bien a la primera), 1 (bien al segundo intento), 0 (fallo) */
  function registrar(apId, nivel, res) {
    var s = stats(apId);
    s.tot += 1; s.pts += res; if (res === 2) s.ok1 += 1;
    if (!s.nv[nivel]) s.nv[nivel] = { ok1: 0, tot: 0 };
    s.nv[nivel].tot += 1; if (res === 2) s.nv[nivel].ok1 += 1;
    guardar(); emitir();
  }
  function puntos(apId) { return stats(apId).pts; }

  /* ---------- bolsas aleatorias: no se repite un ítem hasta agotar el banco ---------- */
  function barajar(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function siguiente(key, n) {
    var b = bolsas[key];
    if (!b || b.n !== n || !Array.isArray(b.o) || b.i >= b.o.length) {
      var ultimo = b && Array.isArray(b.o) && b.o.length ? b.o[b.o.length - 1] : -1;
      var orden = [];
      for (var i = 0; i < n; i++) orden.push(i);
      orden = barajar(orden);
      if (n > 1 && orden[0] === ultimo) { orden.push(orden.shift()); }
      b = bolsas[key] = { n: n, o: orden, i: 0 };
    }
    var idx = b.o[b.i]; b.i += 1;
    lsSet(KEY_BOLSAS, JSON.stringify(bolsas));
    return idx;
  }
  function varios(key, n, k) {
    var out = [];
    for (var i = 0; i < k && i < n; i++) {
      var x = siguiente(key, n), tries = 0;
      while (out.indexOf(x) >= 0 && tries++ < n) x = siguiente(key, n);
      out.push(x);
    }
    return out;
  }

  /* ---------- barra de la alumna ---------- */
  var barras = [];
  function crearBarra(cont, bloqueId) {
    cont.classList.add('lg-barra');
    cont.innerHTML =
      '<span class="lg-t">👤 Tu nombre:</span>' +
      '<input type="text" class="lg-nombre" maxlength="40" placeholder="Escribe tu nombre..." aria-label="Tu nombre">' +
      '<span class="lg-t">Grupo:</span>' +
      '<select class="lg-grupo" aria-label="Grupo"><option value="">Elige...</option><option value="PEP 8">PEP 8</option><option value="PEP 9">PEP 9</option></select>' +
      '<button type="button" class="bok lg-enviar">📤 Enviar mi progreso</button>' +
      '<button type="button" class="lg-azul lg-ver">📊 Ver mi progreso</button>' +
      '<span class="lg-estado" aria-live="polite"></span>';
    var inp = cont.querySelector('.lg-nombre'), sel = cont.querySelector('.lg-grupo');
    var est = cont.querySelector('.lg-estado');
    inp.value = alumna.nombre; sel.value = alumna.grupo;
    inp.addEventListener('input', function () { setAlumna(inp.value, null, cont); });
    sel.addEventListener('change', function () { setAlumna(null, sel.value, cont); });
    cont.querySelector('.lg-enviar').addEventListener('click', function () { enviar(bloqueId, est); });
    cont.querySelector('.lg-ver').addEventListener('click', function () { verProgreso(); });
    barras.push(cont);
    avisoNombre();
  }
  function setAlumna(nombre, grupo, origen) {
    if (nombre !== null && nombre !== undefined) {
      alumna.nombre = nombre; ssSet('pizarraNombreAlumna', nombre.trim()); lsSet('lenguaNombre', nombre.trim());
    }
    if (grupo !== null && grupo !== undefined) {
      alumna.grupo = grupo; ssSet('pizarraGrupoAlumna', grupo); lsSet('lenguaGrupo', grupo);
      if (alumna.nombre.trim()) { perfil().grupo = grupo; guardar(); }
    }
    barras.forEach(function (b) {
      if (b === origen) return;
      b.querySelector('.lg-nombre').value = alumna.nombre;
      b.querySelector('.lg-grupo').value = alumna.grupo;
    });
    avisoNombre(); emitir();
  }
  function avisoNombre() {
    barras.forEach(function (b) {
      var est = b.querySelector('.lg-estado');
      if (!alumna.nombre.trim()) est.textContent = '⚠️ Escribe tu nombre para que se guarden tus puntos.';
      else if (est.textContent.indexOf('Escribe tu nombre') >= 0) est.textContent = '';
    });
  }

  /* ---------- envío a la hoja de la profesora ---------- */
  function enviar(bloqueId, est) {
    var nombre = alumna.nombre.trim();
    if (!nombre) { est.textContent = '⚠️ Escribe tu nombre primero.'; return; }
    var b = bloques.filter(function (x) { return x.id === bloqueId; })[0];
    var p = { Grupo: alumna.grupo || '(sin grupo)' }, tot = 0, ok = 0, n = 0;
    b.apartados.forEach(function (a) {
      var s = stats(a.id); p[a.clave] = s.pts; tot += s.pts; ok += s.ok1; n += s.tot;
    });
    p[b.clave + '_Total'] = tot;
    p[b.clave + '_Acierto_pct'] = n ? Math.round(100 * ok / n) : 0;
    if (URL_APPS_SCRIPT.indexOf('script.google.com') < 0) {
      est.textContent = '⚠️ El envío todavía no está configurado. Avisa a tu profesora.'; return;
    }
    est.textContent = 'Enviando...';
    fetch(URL_APPS_SCRIPT, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ nombre: nombre, puntos: p })
    }).then(function () { est.textContent = '✅ ¡Progreso enviado, ' + nombre + '!'; })
      .catch(function () { est.textContent = '❌ No se pudo enviar. Revisa tu conexión.'; });
  }

  /* ---------- progreso (solo el de la propia alumna) ---------- */
  function registrarBloque(b) { bloques.push(b); }
  function pct(s) { return s.tot ? Math.round(100 * s.ok1 / s.tot) : 0; }
  function htmlProgreso(lista) {
    var h = '';
    if (!alumna.nombre.trim()) h += '<p class="lg-aviso">⚠️ Escribe tu nombre arriba: así tus puntos se guardan en este dispositivo y se suman entre sesiones.</p>';
    else h += '<p class="lg-quien">Progreso de <b>' + esc(alumna.nombre.trim()) + '</b>' + (alumna.grupo ? ' · ' + esc(alumna.grupo) : '') + '. Se guarda en este dispositivo con tu nombre.</p>';
    lista.forEach(function (b) {
      var filas = '', datos = [];
      b.apartados.forEach(function (a) {
        var s = stats(a.id), p = pct(s);
        datos.push({ a: a, s: s, p: p });
        filas += '<div class="lg-pfila"><span class="lg-pnom">' + a.icono + ' ' + esc(a.nombre) + '</span>' +
          '<span class="lg-pbar" title="' + p + '% a la primera"><span style="width:' + p + '%;background:' + color(p) + '"></span></span>' +
          '<span class="lg-pdat"><b>' + s.pts + '</b> pts · ' + (s.tot ? p + '% a la primera · ' + s.tot + ' ejerc.' : 'sin empezar') + '</span></div>';
      });
      var conDatos = datos.filter(function (d) { return d.s.tot >= 4; });
      var mejor = conDatos.slice().sort(function (x, y) { return y.p - x.p || y.s.tot - x.s.tot; })[0];
      var repasar = conDatos.filter(function (d) { return d.p < 70; }).sort(function (x, y) { return x.p - y.p; }).slice(0, 3);
      var tot = 0; datos.forEach(function (d) { tot += d.s.pts; });
      h += '<div class="lg-pbloque"><h3>' + b.icono + ' ' + esc(b.nombre) + ' <span class="badge-sc">Total: ' + tot + ' pts</span></h3>' + filas;
      if (!conDatos.length) h += '<p class="lg-pnota">Haz al menos 4 ejercicios de un apartado para ver lo que mejor te sale y lo que debes repasar.</p>';
      else {
        h += '<p class="lg-pnota">⭐ <b>Lo que mejor te sale:</b> ' + mejor.a.icono + ' ' + esc(mejor.a.nombre) + ' (' + mejor.p + '%)</p>';
        h += '<p class="lg-pnota">🔁 <b>Para repasar:</b> ' + (repasar.length ? repasar.map(function (d) { return d.a.icono + ' ' + esc(d.a.nombre) + ' (' + d.p + '%)'; }).join(', ') : '¡nada por ahora! Sigue así.') + '</p>';
      }
      h += '</div>';
    });
    return h;
  }
  function color(p) { return p >= 80 ? '#2e7d32' : p >= 60 ? '#f9a825' : '#e53935'; }
  function verProgreso() {
    var ov = document.getElementById('lg-modal');
    if (!ov) {
      ov = document.createElement('div'); ov.id = 'lg-modal'; ov.className = 'lg-modal';
      ov.innerHTML = '<div class="lg-modal-caja" role="dialog" aria-modal="true" aria-label="Mi progreso"><button type="button" class="lg-cerrar" aria-label="Cerrar">✖</button><h2>📊 Mi progreso</h2><div class="lg-modal-cuerpo"></div></div>';
      document.body.appendChild(ov);
      ov.addEventListener('click', function (e) { if (e.target === ov) ov.style.display = 'none'; });
      ov.querySelector('.lg-cerrar').addEventListener('click', function () { ov.style.display = 'none'; });
    }
    ov.querySelector('.lg-modal-cuerpo').innerHTML = htmlProgreso(bloques);
    ov.style.display = 'flex';
  }

  /* ---------- utilidades ---------- */
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function md(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }

  /* Arrastrar con ratón o dedo. Los destinos llevan el atributo data-drop.
     onTap: toque sin arrastre. onDrop(destino): soltado sobre un destino. */
  function arrastrable(el, onTap, onDrop) {
    var x0, y0, arrastrando = false, fantasma = null, id = null;
    el.style.touchAction = 'none';
    el.addEventListener('pointerdown', function (e) {
      if (e.button !== undefined && e.button !== 0) return;
      if (el.disabled) return;
      id = e.pointerId; x0 = e.clientX; y0 = e.clientY; arrastrando = false;
      try { el.setPointerCapture(id); } catch (er) { }
    });
    el.addEventListener('pointermove', function (e) {
      if (id !== e.pointerId) return;
      if (!arrastrando && Math.hypot(e.clientX - x0, e.clientY - y0) > 8) {
        arrastrando = true;
        fantasma = el.cloneNode(true); fantasma.classList.add('lg-fantasma');
        fantasma.style.width = el.offsetWidth + 'px';
        document.body.appendChild(fantasma); el.classList.add('lg-origen');
      }
      if (arrastrando) {
        fantasma.style.left = (e.clientX - el.offsetWidth / 2) + 'px';
        fantasma.style.top = (e.clientY - el.offsetHeight / 2) + 'px';
        if (e.clientY > window.innerHeight - 60) window.scrollBy(0, 14);
        else if (e.clientY < 60) window.scrollBy(0, -14);
        marcarDestino(e.clientX, e.clientY);
      }
    });
    function fin(e, cancel) {
      if (id !== e.pointerId) return;
      id = null;
      if (arrastrando) {
        var d = destino(e.clientX, e.clientY);
        fantasma.remove(); fantasma = null; el.classList.remove('lg-origen'); marcarDestino(-1, -1);
        if (d && !cancel) onDrop(d);
      } else if (!cancel) onTap();
      arrastrando = false;
    }
    el.addEventListener('pointerup', function (e) { fin(e, false); });
    el.addEventListener('pointercancel', function (e) { fin(e, true); });
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onTap(); } });
  }
  function destino(x, y) {
    var t = document.elementFromPoint(x, y);
    return t ? t.closest('[data-drop]') : null;
  }
  var ultimoDestino = null;
  function marcarDestino(x, y) {
    var d = x < 0 ? null : destino(x, y);
    if (ultimoDestino && ultimoDestino !== d) ultimoDestino.classList.remove('lg-sobre');
    if (d) d.classList.add('lg-sobre');
    ultimoDestino = d;
  }

  return {
    registrar: registrar, puntos: puntos, alCambiar: alCambiar, stats: stats,
    siguiente: siguiente, varios: varios, barajar: barajar,
    crearBarra: crearBarra, registrarBloque: registrarBloque,
    htmlProgreso: htmlProgreso, verProgreso: verProgreso,
    esc: esc, md: md, arrastrable: arrastrable,
    get nombre() { return alumna.nombre.trim(); }
  };
})();

</script>

  function refrescarPuntos() {

  /* ---------------- un apartado: Concepto · Práctica · Textos ---------------- */
  function construirAp(ap, cont) {

  function construirConcepto(ap, el) {
    var h = '<div class="ibox">' + NOTAS[ap.id] + '</div><div class="lg-fichas">';
    if (ap.tipo === 'homofonos') {
      var vistos = {};
      var grupos = [['tuvo', 'tubo'], ['hola', 'ola'], ['hecho', 'echo'], ['hay', 'ahí', 'ay'], ['a', 'ha'], ['votar', 'botar'], ['vaca', 'baca'], ['valla', 'vaya', 'baya'], ['cayó', 'calló'], ['haya', 'halla'], ['rallar', 'rayar'], ['sabia', 'savia'], ['honda', 'onda'], ['asta', 'hasta'], ['hojear', 'ojear'], ['bello', 'vello'], ['abría', 'habría'], ['haber', 'a ver'], ['vienes', 'bienes'], ['hierba', 'hierva'], ['basto', 'vasto'], ['reveló', 'rebeló']];
      grupos.forEach(function (g) {
        h += '<div class="lg-ficha"><h4>' + g.map(esc).join(' / ') + '</h4>' + g.map(function (w) { return '<p><b>' + esc(w) + '</b>: ' + md(ap.defs[w]) + '</p>'; }).join('') + '</div>';
      });
    } else {
      Object.keys(ap.rules).forEach(function (k) {
        var r = ap.rules[k];
        if (/^U/.test(k) || k === 'x') return;
        if (/[0-9]x$/.test(k) && k !== 'J1x' && k !== 'H1x') return;   // ya se dice en la regla principal
        var exc = /x$|H1y$/.test(k);
        h += '<div class="lg-ficha' + (exc ? ' lg-ficha-exc' : '') + '">' + (exc ? '<h4>⚠️ ¡Ojo!</h4>' : '') + '<p>' + md(r.t) + '</p>' + (r.ej ? '<p class="lg-ej">Ejemplos: <i>' + esc(r.ej) + '</i></p>' : '') + '</div>';
      });
      var usos = Object.keys(ap.rules).filter(function (k) { return /^U/.test(k); });
      if (usos.length) {
        h += '<div class="lg-ficha lg-ficha-uso"><h4>📚 Palabras de uso</h4><p>Algunas palabras no siguen ninguna regla y hay que aprenderlas: ' + usos.map(function (k) { return '<i>' + esc(ap.rules[k].ej) + '</i>'; }).join('; ') + '.</p></div>';
      }
    }
    el.innerHTML = h + '</div>';
  }

  function cabeceraPractica(ap, el, conNiveles, onNuevo) {
    var bar = document.createElement('div'); bar.className = 'lg-ctrl';
    var nivel = 1, botones = [];
    if (conNiveles) {
      NIVELES.forEach(function (n) {
        var b = document.createElement('button'); b.type = 'button'; b.className = 'lg-nivel' + (n.k === 1 ? ' on' : '');
        b.textContent = n.t;
        b.addEventListener('click', function () { nivel = n.k; botones.forEach(function (x) { x.classList.toggle('on', x === b); }); onNuevo(nivel); });
        botones.push(b); bar.appendChild(b);
      });
    }
    var nb = document.createElement('button'); nb.type = 'button'; nb.className = 'bpurp';
    nb.textContent = conNiveles ? '🎲 Nuevo' : '🎲 Otro texto';
    nb.addEventListener('click', function () { onNuevo(nivel); });
    bar.appendChild(nb);
    var sc = document.createElement('span'); sc.className = 'badge-sc';
    sc.innerHTML = 'Puntos: <b class="or-pts-' + ap.id + '">' + LG.puntos('or_' + ap.id) + '</b>';
    bar.appendChild(sc);
    el.appendChild(bar);
    var zona = document.createElement('div'); zona.className = 'lg-zona'; el.appendChild(zona);
    return zona;

  function construirPractica(ap, el) {
    var zona = cabeceraPractica(ap, el, true, function (nv) { nuevo(nv); });
    function nuevo(nv) {
      var ctx = { ap: ap, apKey: 'or_' + ap.id, nivel: nv, zona: zona, otra: function () { nuevo(nv); } };
      zona.innerHTML = '';
      if (ap.tipo === 'letras') {
        if (nv === 1) exClasificarLetras(ctx);
        else if (nv === 2) exHuecosLetras(ctx, ap.medio[LG.siguiente(ctx.apKey + ':2', ap.medio.length)], 'Completa las palabras: toca un hueco y después la letra que va en él (o arrastra la letra al hueco).');
        else exDetectar(ctx);
      } else if (ap.tipo === 'mayus') {
        if (nv === 1) exClasificarMayus(ctx);
        else exMayus(ctx, ap[nv === 2 ? 'medio' : 'dificil'][LG.siguiente(ctx.apKey + ':' + nv, ap[nv === 2 ? 'medio' : 'dificil'].length)], 'Toca las palabras que deben ir con mayúscula.');
      } else {
        var banco = ap[['facil', 'medio', 'dificil'][nv - 1]];
        exHom(ctx, banco[LG.siguiente(ctx.apKey + ':' + nv, banco.length)], 'Toca cada hueco y elige la palabra correcta.');
      }
    }
    nuevo(1);
  }

  function construirTextos(ap, el) {
    var zona = cabeceraPractica(ap, el, false, function () { nuevo(); });
    function nuevo() {
      var t = ap.textos[LG.siguiente('or_' + ap.id + ':t', ap.textos.length)];
      var ctx = { ap: ap, apKey: 'or_' + ap.id, nivel: 't', zona: zona, otra: nuevo };
      zona.innerHTML = '';
      if (ap.tipo === 'letras') exTextoErrores(ctx, t);
      else if (ap.tipo === 'mayus') exMayus(ctx, t.tk, 'Este texto está escrito todo en minúscula. Toca las palabras que deben ir con mayúscula.', t.t);
      else exHom(ctx, t.s, 'Lee el texto. Toca cada hueco y elige la palabra correcta.', t.t);
    }
    nuevo();
  }

  /* ---------------- utilidades de ejercicio ---------------- */
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
  function boton(txt, cls, f) { var b = el('button', cls, txt); b.type = 'button'; b.addEventListener('click', f); return b; }
  function enunciado(ctx, txt, titulo) {
    if (titulo) ctx.zona.appendChild(el('h3', 'lg-titulo', '📖 ' + esc(titulo)));
    ctx.zona.appendChild(el('p', 'lg-enun', txt));
  }
  function panel(ctx) { var p = el('div', 'lg-fb'); p.setAttribute('aria-live', 'polite'); return p; }
  function fbMostrar(p, items, cabecera, cls) {
    p.className = 'lg-fb on ' + (cls || '');
    p.innerHTML = (cabecera ? '<p class="lg-fbcab">' + cabecera + '</p>' : '') + items.map(function (i) { return '<div class="lg-fbitem">' + i + '</div>'; }).join('');
  }
  function resumen(ctx, p, res, extra) {
    var pts = res.reduce(function (a, b) { return a + b; }, 0), max = res.length * 2;
    var cab = pts === max ? '🎉 ¡Perfecto! Todo bien a la primera.' : pts >= max / 2 ? '👍 ¡Bien hecho!' : '💪 Sigue practicando: cada error te enseña algo.';
    var d = el('div', 'lg-fin', '<span>' + cab + ' <b>+' + pts + ' puntos</b></span>');
    d.appendChild(boton('🎲 Siguiente', 'bok', ctx.otra));
    ctx.zona.appendChild(d);
    if (extra) p.insertAdjacentHTML('beforeend', extra);
  }
  function regla(ap, r, letra) {
    if (r && r.indexOf('FAM=') === 0) {
      return 'Pertenece a la familia de <b>«' + esc(r.slice(4)) + '»</b>, que se escribe con <b>' + esc(letra || '') + '</b>: las palabras de una misma familia suelen conservar la misma letra.';
    }
    var x = ap.rules[r]; return x ? md(x.t) : '';
  }
  function etiquetaOpcion(ap, o) { return ap.id === 'h' ? (o === '-' ? 'sin h' : 'con h') : o; }
  function letraVisible(o) { return o === '-' ? '' : o; }
  function huecoHTML(pre, post) { return esc(pre) + '<span class="lg-gapmini"></span>' + esc(post); }
  function capitalizar(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function diffHTML(escrito, correcto) {
    // marca en rojo las letras que no coinciden (alineando por el principio y el final)
    var i = 0; while (i < escrito.length && i < correcto.length && escrito[i] === correcto[i]) i++;
    var j = 0; while (j < escrito.length - i && j < correcto.length - i && escrito[escrito.length - 1 - j] === correcto[correcto.length - 1 - j]) j++;
    var mal = escrito.slice(i, escrito.length - j);
    return esc(escrito.slice(0, i)) + '<span class="lg-mal">' + (mal ? esc(mal) : '_') + '</span>' + esc(escrito.slice(escrito.length - j));
  }
  function letraDiferente(w, c) {
    var i = 0; while (i < w.length && i < c.length && w[i] === c[i]) i++;
    var j = 0; while (j < w.length - i && j < c.length - i && w[w.length - 1 - j] === c[c.length - 1 - j]) j++;
    return c.slice(i, c.length - j);
  }
  function normaliza(s) { return s.trim().toLowerCase(); }

  /* Agrupa piezas (texto u objeto) en palabras: no se parte una palabra al cambiar de línea */
  function enPalabras(segs) {
    var palabras = [], actual = [];
    segs.forEach(function (s) {
      if (typeof s !== 'string') { actual.push(s); return; }
      s.split(/(\s+)/).forEach(function (frag) {
        if (frag === '') return;
        if (/^\s+$/.test(frag)) { if (actual.length) palabras.push(actual); actual = []; palabras.push(' '); }
        else actual.push(frag);
      });
    });
    if (actual.length) palabras.push(actual);
    return palabras;
  }

  /* =========== 1) CLASIFICAR EN COLUMNAS (letras ⭐) =========== */
  function exClasificarLetras(ctx) {
    var ap = ctx.ap;
    var idx = LG.varios(ctx.apKey + ':1', ap.facil.length, 6);
    var items = idx.map(function (i) { var it = ap.facil[i]; return { it: it, label: huecoHTML(it.pre, it.post), ok: it.a || '-', palabra: it.pre + it.a + it.post, final: esc(it.pre) + '<span class="lg-letra">' + esc(it.a) + '</span>' + esc(it.post) }; });
    var cols = ap.opts.map(function (o) { return { v: o, t: etiquetaOpcion(ap, o) }; });
    clasificar(ctx, items, cols, 'Arrastra cada palabra a la columna de la letra que le falta (también puedes tocar la palabra y después la columna).',
      function (x, elegido) {
        return '📍 <b>Dónde:</b> «' + x.label + '» no va en la columna <b>' + esc(etiquetaOpcion(ap, elegido)) + '</b>.<br>💡 <b>Por qué:</b> ' + regla(ap, x.it.r, letraVisible(x.ok));
      },
      function (x) { return '✅ Es <b>' + esc(x.palabra) + '</b>. ' + regla(ap, x.it.r, letraVisible(x.ok)); });
  }

  /* =========== 1b) CLASIFICAR (mayúsculas ⭐) =========== */
  function exClasificarMayus(ctx) {
    var ap = ctx.ap;
    var idx = LG.varios(ctx.apKey + ':1', ap.facil.length, 6);
    var items = idx.map(function (i) {
      var it = ap.facil[i], low = it.w.charAt(0).toLowerCase() + it.w.slice(1);
      return { it: it, label: esc(low) + (it.ctx ? ' <small>(' + esc(it.ctx) + ')</small>' : ''), ok: it.cap ? 'M' : 'm', palabra: it.w };
    });
    clasificar(ctx, items, [{ v: 'M', t: 'Con MAYÚSCULA' }, { v: 'm', t: 'Con minúscula' }], 'Arrastra cada palabra a su columna: ¿se escribe con mayúscula o con minúscula?',
      function (x) { return '📍 <b>Dónde:</b> «' + x.label + '» no va en esa columna.<br>💡 <b>Por qué:</b> ' + regla(ap, x.it.r); },
      function (x) { return '✅ Se escribe <b>' + esc(x.palabra) + '</b>. ' + regla(ap, x.it.r); });
  }

  function clasificar(ctx, items, cols, consigna, porQue, solucion) {
    enunciado(ctx, consigna);
    var res = [], seleccion = null;
    var bandeja = el('div', 'lg-bandeja'); bandeja.dataset.drop = 'bandeja';
    var colWrap = el('div', 'lg-cols');
    var colEls = cols.map(function (c) {
      var ce = el('div', 'lg-col'); ce.dataset.drop = c.v;
      var hd = el('button', 'lg-colcab', esc(c.t)); hd.type = 'button';
      hd.addEventListener('click', function () { if (seleccion) mover(seleccion, ce); });
      ce.addEventListener('click', function (e) { if (e.target === ce && seleccion) mover(seleccion, ce); });
      ce.appendChild(hd); colWrap.appendChild(ce); return ce;
    });
    bandeja.addEventListener('click', function (e) { if (e.target === bandeja && seleccion) mover(seleccion, bandeja); });
    var tarjetas = items.map(function (x, i) {
      var b = el('button', 'lg-carta', x.label); b.type = 'button'; b.dataset.i = i; b._ok = x.ok;
      x.el = b; x.intentos = 0; x.hecho = false;
      LG.arrastrable(b, function () {
        if (x.hecho) return;
        if (seleccion === b) { b.classList.remove('sel'); seleccion = null; return; }
        if (seleccion) seleccion.classList.remove('sel');
        seleccion = b; b.classList.add('sel');
      }, function (d) { if (!x.hecho) mover(b, d.dataset.drop === 'bandeja' ? bandeja : d); });
      bandeja.appendChild(b); return b;
    });
    function mover(b, destinoEl) {
      if (destinoEl.classList.contains('lg-col')) destinoEl.appendChild(b); else bandeja.appendChild(b);
      b.classList.remove('sel', 'mal'); seleccion = null; actualizar();
    }
    ctx.zona.appendChild(bandeja); ctx.zona.appendChild(colWrap);
    var acc = el('div', 'lg-acciones'); var comp = boton('✅ Comprobar', 'bok', comprobar); acc.appendChild(comp); ctx.zona.appendChild(acc);
    var p = panel(ctx); ctx.zona.appendChild(p);
    function actualizar() { comp.disabled = items.some(function (x) { return !x.hecho && x.el.parentNode === bandeja; }); bandeja.classList.toggle('vacia', !bandeja.querySelector('.lg-carta')); }
    actualizar();
    function comprobar() {
      var msgs = [];
      items.forEach(function (x) {
        if (x.hecho) return;
        var col = x.el.parentNode.dataset.drop;
        if (col === x.ok) {
          x.hecho = true; x.el.classList.add('bien'); x.el.disabled = true;
          var r = x.intentos === 0 ? 2 : 1; res.push(r); LG.registrar(ctx.apKey, ctx.nivel, r);
          x.el.innerHTML = x.final || esc(x.palabra);
        } else {
          x.intentos += 1;
          if (x.intentos >= 2) {
            x.hecho = true; res.push(0); LG.registrar(ctx.apKey, ctx.nivel, 0);
            colEls.forEach(function (c) { if (c.dataset.drop === x.ok) c.appendChild(x.el); });
            x.el.classList.add('sol'); x.el.disabled = true; x.el.innerHTML = x.final || esc(x.palabra);
            msgs.push(solucion(x));
          } else { x.el.classList.add('mal'); msgs.push(porQue(x, col)); }
        }
      });
      terminar(msgs);
    }
    function terminar(msgs) {
      var quedan = items.some(function (x) { return !x.hecho; });
      if (msgs.length) fbMostrar(p, msgs, quedan ? '🔍 Revisa estas palabras y vuelve a comprobar:' : '🔍 Corrección:', 'warn');
      else p.className = 'lg-fb';
      if (!quedan) { comp.disabled = true; bandeja.classList.add('terminado'); resumen(ctx, p, res); } else actualizar();
    }
  }

  /* =========== 2) HUECOS CON FICHAS (letras ⭐⭐) =========== */
  function exHuecosLetras(ctx, segs, consigna) {
    var ap = ctx.ap;
    enunciado(ctx, consigna);
    var gaps = [], frase = el('div', 'lg-frase');
    var palabras = enPalabras(segs);
    var inicio = true;
    palabras.forEach(function (pal) {
      if (pal === ' ') { frase.appendChild(document.createTextNode(' ')); return; }
      var w = el('span', 'lg-pal');
      var texto = pal.map(function (s) { return typeof s === 'string' ? s : (s.a === '' ? '' : s.a); }).join('');
      pal.forEach(function (s, k) {
        if (typeof s === 'string') { w.appendChild(document.createTextNode(s)); return; }
        var antes = pal.slice(0, k).filter(function (x) { return typeof x === 'string'; }).join('');
        var esInicio = inicio && !/[A-Za-zÁÉÍÓÚÑáéíóúñü]/.test(antes);
        var g = { a: s.a || '-', r: s.r, intentos: 0, hecho: false, valor: null, mayus: esInicio };
        var izq = pal.slice(0, k).map(function (x) { return typeof x === 'string' ? x : '▢'; }).join('');
        var der = pal.slice(k + 1).map(function (x) { return typeof x === 'string' ? x : '▢'; }).join('');
        g.mostrar = (izq.replace(/^[¿¡«(]+/, '') + '▢' + der).replace(/[.,;:!?»)]+$/, '');
        g.palabra = texto.replace(/^[¿¡«(]+/, '').replace(/[.,;:!?»)]+$/, '');
        var b = el('button', 'lg-gap'); b.type = 'button'; b.dataset.drop = 'gap'; b.dataset.g = gaps.length;
        b.setAttribute('aria-label', 'hueco ' + (gaps.length + 1));
        b.addEventListener('click', function () { if (!g.hecho) elegir(g); });
        g.el = b; b._ok = g.a; gaps.push(g); w.appendChild(b);
      });
      inicio = false;
      frase.appendChild(w);
    });
    ctx.zona.appendChild(frase);
    var fichas = el('div', 'lg-fichas-letras');
    ap.opts.forEach(function (o) {
      var f = el('button', 'lg-ficha-l', esc(etiquetaOpcion(ap, o) === 'con h' ? 'h' : etiquetaOpcion(ap, o))); f.type = 'button'; f._v = o;
      LG.arrastrable(f, function () { if (actual) poner(actual, o); }, function (d) {
        if (d.dataset.drop === 'gap') { var g = gaps[+d.dataset.g]; if (!g.hecho) poner(g, o); }
      });
      fichas.appendChild(f);
    });
    ctx.zona.appendChild(fichas);
    var acc = el('div', 'lg-acciones'); var comp = boton('✅ Comprobar', 'bok', comprobar); acc.appendChild(comp); ctx.zona.appendChild(acc);
    var p = panel(ctx); ctx.zona.appendChild(p);
    var actual = null, res = [];
    function elegir(g) { if (actual) actual.el.classList.remove('sel'); actual = g; g.el.classList.add('sel'); }
    function pintar(g) {
      var v = g.valor === null ? '' : letraVisible(g.valor);
      g.el.textContent = g.valor === '-' ? '·' : (g.mayus ? capitalizar(v) : v);
      g.el.classList.toggle('lleno', g.valor !== null);
      g.el.classList.toggle('sinh', g.valor === '-');
    }
    function poner(g, o) {
      g.valor = o; g.el.classList.remove('mal'); pintar(g);
      var sig = gaps.filter(function (x) { return !x.hecho && x.valor === null; })[0];
      if (sig) elegir(sig); else { g.el.classList.remove('sel'); actual = null; }
      comp.disabled = gaps.some(function (x) { return !x.hecho && x.valor === null; });
    }
    elegir(gaps[0]); comp.disabled = true;
    function comprobar() {
      var msgs = [];
      gaps.forEach(function (g, n) {
        if (g.hecho) return;
        if (g.valor === g.a) {
          g.hecho = true; g.el.classList.add('bien'); g.el.disabled = true;
          if (g.a === '-') g.el.classList.add('oculto');
          var r = g.intentos === 0 ? 2 : 1; res.push(r); LG.registrar(ctx.apKey, ctx.nivel, r);
        } else {
          g.intentos += 1;
          if (g.intentos >= 2) {
            g.hecho = true; g.valor = g.a; pintar(g); g.el.classList.add('sol'); g.el.disabled = true;
            if (g.a === '-') g.el.classList.add('oculto');
            res.push(0); LG.registrar(ctx.apKey, ctx.nivel, 0);
            msgs.push('✅ La palabra correcta es <b>' + esc(g.palabra) + '</b>. ' + regla(ap, g.r, letraVisible(g.a)));
          } else {
            g.el.classList.add('mal');
            msgs.push('📍 <b>Dónde:</b> hueco ' + (n + 1) + ', en «' + esc(g.mostrar) + '»: no va <b>' + esc(etiquetaOpcion(ap, g.valor)) + '</b>.<br>💡 <b>Por qué:</b> ' + regla(ap, g.r, letraVisible(g.a)));
            g.valor = null; pintar(g);
          }
        }
      });
      var quedan = gaps.some(function (g) { return !g.hecho; });
      if (msgs.length) fbMostrar(p, msgs, quedan ? '🔍 Corrige los huecos marcados en rojo:' : '🔍 Corrección:', 'warn'); else p.className = 'lg-fb';
      if (quedan) { var sig = gaps.filter(function (g) { return !g.hecho; })[0]; elegir(sig); comp.disabled = true; }
      else { comp.disabled = true; fichas.classList.add('apagado'); gaps.forEach(function (g) { g.el.classList.remove('sel'); }); resumen(ctx, p, res); }
    }
  }

  /* =========== 3) DETECTA Y CORRIGE (letras ⭐⭐⭐) =========== */
  function exDetectar(ctx) {
    var ap = ctx.ap, segs = ap.dificil[LG.siguiente(ctx.apKey + ':3', ap.dificil.length)];
    enunciado(ctx, 'En esta oración hay <b>una palabra mal escrita</b>. Tócala y después escríbela bien.');
    var frase = el('div', 'lg-frase lg-tocable'), err = null, fallosBusca = 0, fallosEscribe = 0, encontrado = false;
    var chips = [];
    enPalabras(segs).forEach(function (pal) {
      if (pal === ' ') { frase.appendChild(document.createTextNode(' ')); return; }
      var obj = pal.filter(function (x) { return typeof x !== 'string'; })[0];
      var pre = '', post = '', antes = true;
      pal.forEach(function (x) { if (typeof x !== 'string') { antes = false; return; } if (antes) pre += x; else post += x; });
      var texto = obj ? obj.w : pre;
      var m = texto.match(/^([¿¡«("]*)(.*?)([.,;:!?»)"]*)$/);
      var chip = el('button', 'lg-chip'); chip.type = 'button';
      if (obj) { chip.innerHTML = esc(pre) + '<span class="lg-w">' + esc(obj.w) + '</span>' + esc(post); err = { chip: chip, o: obj, pre: pre, post: post }; chip._err = obj.c; }
      else chip.innerHTML = esc(m[1]) + '<span class="lg-w">' + esc(m[2]) + '</span>' + esc(m[3]);
      if (!/[A-Za-zÁÉÍÓÚÑáéíóúñü]/.test(chip.textContent)) { frase.appendChild(document.createTextNode(chip.textContent)); return; }
      chip.addEventListener('click', function () { tocar(chip, !!obj, obj ? obj.w : m[2]); });
      chips.push(chip); frase.appendChild(chip);
    });
    ctx.zona.appendChild(frase);
    var zonaEsc = el('div', 'lg-escribe'); zonaEsc.style.display = 'none'; ctx.zona.appendChild(zonaEsc);
    var p = panel(ctx); ctx.zona.appendChild(p);
    function tocar(chip, esError, palabra) {
      if (encontrado) return;
      if (esError) { encontrado = true; chip.classList.add('encontrado'); p.className = 'lg-fb'; abrirEscritura(); return; }
      fallosBusca += 1; chip.classList.add('noes'); chip.disabled = true;
      if (fallosBusca >= 2) {
        encontrado = true; err.chip.classList.add('encontrado');
        fbMostrar(p, ['📍 La palabra mal escrita es <b>«' + esc(err.o.w) + '»</b> (la he marcado en amarillo). Ahora escríbela bien.'], '', 'warn');
        abrirEscritura();
      } else fbMostrar(p, ['📍 <b>«' + esc(palabra) + '»</b> está bien escrita. Busca otra palabra.'], '', 'warn');
    }
    function abrirEscritura() {
      chips.forEach(function (c) { c.disabled = true; });
      zonaEsc.style.display = 'flex';
      zonaEsc.innerHTML = '<label>✏️ Escríbela bien: <input type="text" class="lg-in" autocomplete="off" autocapitalize="off" spellcheck="false"></label>';
      var inp = zonaEsc.querySelector('input'); inp.value = err.o.w;
      var b = boton('✅ Comprobar', 'bok', comprobar); zonaEsc.appendChild(b);
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') comprobar(); });
      try { inp.focus(); inp.select(); } catch (e) { }
      function comprobar() {
        var v = inp.value.trim();
        if (!v) return;
        var c = err.o.c, letra = letraDiferente(err.o.w, c);
        if (normaliza(v) === normaliza(c)) {
          var r = (fallosBusca === 0 && fallosEscribe === 0) ? 2 : (fallosEscribe < 2 ? 1 : 0);
          fin(r, '✅ ¡Correcto! Se escribe <b>' + esc(c) + '</b>. ' + regla(ap, err.o.r, letra));
        } else {
          fallosEscribe += 1;
          if (fallosEscribe >= 2) fin(0, '✅ La palabra correcta es <b>' + esc(c) + '</b>. ' + regla(ap, err.o.r, letra));
          else fbMostrar(p, ['📍 <b>Dónde:</b> en lo que has escrito, revisa lo marcado en rojo: <span class="lg-diff">' + diffHTML(v, c) + '</span>',
            '💡 <b>Por qué:</b> ' + regla(ap, err.o.r, letra)], '🔍 Todavía no está bien:', 'warn');
        }
      }
      function fin(r, msg) {
        LG.registrar(ctx.apKey, ctx.nivel, r);
        err.chip.querySelector('.lg-w').textContent = err.o.c;
        err.chip.classList.remove('encontrado'); err.chip.classList.add(r ? 'bien' : 'sol');
        zonaEsc.style.display = 'none';
        fbMostrar(p, [msg], '', r ? 'ok' : 'warn');
        resumen(ctx, p, [r]);
      }
    }
  }

  /* =========== 4) TOCAR LAS MAYÚSCULAS (⭐⭐, ⭐⭐⭐ y textos) =========== */
  function exMayus(ctx, tokens, consigna, titulo) {
    var ap = ctx.ap;
    enunciado(ctx, consigna, titulo);
    var frase = el('div', 'lg-frase lg-tocable' + (titulo ? ' lg-texto' : '')), lista = [];
    tokens.forEach(function (t, i) {
      if (i) frase.appendChild(document.createTextNode(' '));
      if (!/[A-Za-zÁÉÍÓÚÑáéíóúñü]/.test(t.w)) { frase.appendChild(document.createTextNode(t.l + t.w + t.t)); return; }
      var low = t.w.charAt(0).toLowerCase() + t.w.slice(1);
      var c = el('button', 'lg-chip'); c.type = 'button';
      var x = { t: t, el: c, low: low, on: false, hecho: false }; c._cap = t.cap;
      function pinta() { c.innerHTML = esc(t.l) + '<span class="lg-w">' + esc(x.on ? capitalizar(low) : low) + '</span>' + esc(t.t); c.classList.toggle('mayus', x.on); }
      x.pinta = pinta; pinta();
      c.addEventListener('click', function () { if (x.hecho) return; x.on = !x.on; c.classList.remove('mal', 'falta'); pinta(); });
      lista.push(x); frase.appendChild(c);
    });
    ctx.zona.appendChild(frase);
    var acc = el('div', 'lg-acciones'); var comp = boton('✅ Comprobar', 'bok', comprobar); acc.appendChild(comp); ctx.zona.appendChild(acc);
    var p = panel(ctx); ctx.zona.appendChild(p);
    var intento = 0;
    function porque(x) {
      var r = x.t.r || 'x';
      return regla(ap, r);
    }
    function comprobar() {
      var malas = lista.filter(function (x) { return x.on !== x.t.cap; });
      if (!malas.length) {
        var r = intento === 0 ? 2 : 1;
        lista.forEach(function (x) { x.hecho = true; x.el.disabled = true; if (x.t.cap) x.el.classList.add('bien'); });
        LG.registrar(ctx.apKey, ctx.nivel, r);
        fbMostrar(p, ['✅ ¡Todas las mayúsculas están bien!'], '', 'ok');
        comp.disabled = true; resumen(ctx, p, [r]); return;
      }
      intento += 1;
      var msgs = malas.map(function (x) {
        var pal = '«' + esc(x.t.cap ? capitalizar(x.low) : x.low) + '»';
        if (intento >= 2) return (x.t.cap ? '✅ ' + pal + ' va con <b>mayúscula</b>: ' : '✅ ' + pal + ' va con <b>minúscula</b>: ') + porque(x);
        return '📍 <b>Dónde:</b> «' + esc(x.low) + '» ' + (x.t.cap ? 'debe ir con <b>mayúscula</b>.' : 'debe ir con <b>minúscula</b>.') + '<br>💡 <b>Por qué:</b> ' + porque(x);
      });
      if (intento >= 2) {
        lista.forEach(function (x) { x.hecho = true; x.el.disabled = true; if (x.on !== x.t.cap) { x.on = x.t.cap; x.pinta(); x.el.classList.add('sol'); } });
        LG.registrar(ctx.apKey, ctx.nivel, 0);
        fbMostrar(p, msgs, '🔍 Corrección:', 'warn'); comp.disabled = true; resumen(ctx, p, [0]);
      } else {
        malas.forEach(function (x) { x.el.classList.add(x.t.cap ? 'falta' : 'mal'); });
        fbMostrar(p, msgs, '🔍 Revisa las palabras marcadas y vuelve a comprobar:', 'warn');
      }
    }
  }

  /* =========== 5) HOMÓFONOS: hueco con opciones =========== */
  function exHom(ctx, segs, consigna, titulo) {
    var ap = ctx.ap;
    enunciado(ctx, consigna, titulo);
    var frase = el('div', 'lg-frase' + (titulo ? ' lg-texto' : '')), gaps = [];
    segs.forEach(function (s) {
      if (typeof s === 'string') { frase.appendChild(document.createTextNode(s)); return; }
      var g = { a: s.a, o: LG.barajar(s.o), valor: null, intentos: 0, hecho: false };
      var b = el('button', 'lg-gap lg-gapw'); b.type = 'button'; b.textContent = '……';
      b.addEventListener('click', function () { if (!g.hecho) elegir(g); });
      g.el = b; b._ok = g.a; gaps.push(g); frase.appendChild(b);
    });
    ctx.zona.appendChild(frase);
    var opciones = el('div', 'lg-opciones'); ctx.zona.appendChild(opciones);
    var acc = el('div', 'lg-acciones'); var comp = boton('✅ Comprobar', 'bok', comprobar); acc.appendChild(comp); ctx.zona.appendChild(acc);
    var p = panel(ctx); ctx.zona.appendChild(p);
    var actual = null, res = [];
    function elegir(g) {
      if (actual) actual.el.classList.remove('sel');
      actual = g; g.el.classList.add('sel');
      opciones.innerHTML = '';
      g.o.forEach(function (o) {
        opciones.appendChild(boton(esc(o), 'lg-opc', function () {
          g.valor = o; g.el.textContent = o; g.el.classList.add('lleno'); g.el.classList.remove('mal');
          var sig = gaps.filter(function (x) { return !x.hecho && x.valor === null; })[0];
          if (sig) elegir(sig); else { g.el.classList.remove('sel'); actual = null; opciones.innerHTML = ''; }
          comp.disabled = gaps.some(function (x) { return !x.hecho && x.valor === null; });
        }));
      });
    }
    function def(w) { var d = ap.defs[w.toLowerCase()]; return d ? '<b>' + esc(w) + '</b>: ' + md(d) : ''; }
    elegir(gaps[0]); comp.disabled = true;
    function comprobar() {
      var msgs = [];
      gaps.forEach(function (g, n) {
        if (g.hecho) return;
        if (g.valor === g.a) {
          g.hecho = true; g.el.classList.add('bien'); g.el.disabled = true;
          var r = g.intentos === 0 ? 2 : 1; res.push(r); LG.registrar(ctx.apKey, ctx.nivel, r);
        } else {
          g.intentos += 1;
          if (g.intentos >= 2) {
            g.hecho = true; g.valor = g.a; g.el.textContent = g.a; g.el.classList.add('sol'); g.el.disabled = true;
            res.push(0); LG.registrar(ctx.apKey, ctx.nivel, 0);
            msgs.push('✅ La palabra correcta es <b>' + esc(g.a) + '</b>. ' + def(g.a));
          } else {
            msgs.push('📍 <b>Dónde:</b> hueco ' + (n + 1) + ': aquí no va <b>«' + esc(g.valor) + '»</b>.<br>💡 <b>Por qué:</b> ' + def(g.valor) + ' Piensa qué significa la frase.');
            g.el.classList.add('mal'); g.valor = null; g.el.textContent = '……'; g.el.classList.remove('lleno');
          }
        }
      });
      var quedan = gaps.some(function (g) { return !g.hecho; });
      if (msgs.length) fbMostrar(p, msgs, quedan ? '🔍 Corrige los huecos marcados en rojo:' : '🔍 Corrección:', 'warn'); else p.className = 'lg-fb';
      if (quedan) { elegir(gaps.filter(function (g) { return !g.hecho; })[0]); comp.disabled = true; }
      else { comp.disabled = true; opciones.innerHTML = ''; gaps.forEach(function (g) { g.el.classList.remove('sel'); }); resumen(ctx, p, res); }
    }
  }

  /* =========== 6) TEXTO CON ERRORES: tacha las palabras mal escritas =========== */
  function exTextoErrores(ctx, t) {
    var ap = ctx.ap;
    var errores = t.s.filter(function (s) { return typeof s !== 'string'; });
    enunciado(ctx, 'En este texto hay <b>' + errores.length + ' palabras mal escritas</b>. Tócalas para tacharlas y después pulsa «Comprobar».', t.t);
    var frase = el('div', 'lg-frase lg-tocable lg-texto'), chips = [];
    enPalabras(t.s).forEach(function (pal) {
      if (pal === ' ') { frase.appendChild(document.createTextNode(' ')); return; }
      var obj = pal.filter(function (x) { return typeof x !== 'string'; })[0];
      var pre = '', post = '', antes = true;
      pal.forEach(function (x) { if (typeof x !== 'string') { antes = false; return; } if (antes) pre += x; else post += x; });
      var c = el('button', 'lg-chip'); c.type = 'button';
      var m = (obj ? obj.w : pre).match(/^([¿¡«("]*)(.*?)([.,;:!?»)"]*)$/);
      if (obj) c.innerHTML = esc(pre) + '<span class="lg-w">' + esc(obj.w) + '</span>' + esc(post);
      else c.innerHTML = esc(m[1]) + '<span class="lg-w">' + esc(m[2]) + '</span>' + esc(m[3]);
      if (!/[A-Za-zÁÉÍÓÚÑáéíóúñü]/.test(c.textContent)) { frase.appendChild(document.createTextNode(c.textContent)); return; }
      var x = { el: c, o: obj || null, w: obj ? obj.w : m[2], on: false, hecho: false }; c._err = !!obj;
      c.addEventListener('click', function () { if (x.hecho) return; x.on = !x.on; c.classList.toggle('tachada', x.on); c.classList.remove('noes'); });
      chips.push(x); frase.appendChild(c);
    });
    ctx.zona.appendChild(frase);
    var acc = el('div', 'lg-acciones'); var comp = boton('✅ Comprobar', 'bok', comprobar); acc.appendChild(comp); ctx.zona.appendChild(acc);
    var p = panel(ctx); ctx.zona.appendChild(p);
    var intento = 0, res = [];
    function explica(o) { return '<b>' + esc(o.w) + '</b> → <b>' + esc(o.c) + '</b>: ' + regla(ap, o.r, letraDiferente(o.w, o.c)); }
    function comprobar() {
      intento += 1;
      var msgs = [];
      chips.forEach(function (x) {
        if (x.hecho) return;
        if (x.o && x.on) {
          x.hecho = true; x.el.classList.remove('tachada'); x.el.classList.add('bien'); x.el.disabled = true;
          x.el.querySelector('.lg-w').innerHTML = '<s>' + esc(x.o.w) + '</s> ' + esc(x.o.c);
          var r = intento === 1 ? 2 : 1; res.push(r); LG.registrar(ctx.apKey, ctx.nivel, r);
          msgs.push('✅ ' + explica(x.o));
        } else if (!x.o && x.on) {
          x.on = false; x.el.classList.remove('tachada'); x.el.classList.add('noes');
          msgs.push('📍 <b>«' + esc(x.w) + '»</b> está bien escrita.');
        }
      });
      var faltan = chips.filter(function (x) { return x.o && !x.hecho; });
      if (faltan.length && intento < 2) {
        msgs.unshift('🔎 Te falta' + (faltan.length > 1 ? 'n' : '') + ' <b>' + faltan.length + '</b> palabra' + (faltan.length > 1 ? 's' : '') + ' mal escrita' + (faltan.length > 1 ? 's' : '') + ' por encontrar. Vuelve a leer el texto con atención.');
        fbMostrar(p, msgs, '🔍 Revisión:', 'warn');
        return;
      }
      faltan.forEach(function (x) {
        x.hecho = true; x.el.classList.add('sol'); x.el.disabled = true;
        x.el.querySelector('.lg-w').innerHTML = '<s>' + esc(x.o.w) + '</s> ' + esc(x.o.c);
        res.push(0); LG.registrar(ctx.apKey, ctx.nivel, 0);
        msgs.push('🟠 No la encontraste: ' + explica(x.o));
      });
      chips.forEach(function (x) { x.hecho = true; x.el.disabled = true; });
      fbMostrar(p, msgs, '🔍 Corrección del texto:', faltan.length ? 'warn' : 'ok');
      comp.disabled = true; resumen(ctx, p, res);
    }
  }

  // primer apartado abierto
  abrirAp(D[0].id);
  refrescarPuntos();
})();

</script>
